<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <h1>Sudoku Game</h1>
  <div class="game-status">
    <span>Time: <strong id="timer">00:00</strong></span>
    <span>Hints: <strong id="hint-count">0</strong></span>
  </div>
  <div id="sudoku-board"></div>
  <div class="controls">
    <label for="difficulty">Difficulty:</label>
    <select id="difficulty" name="difficulty">
      <option value="easy">Easy</option>
      <option value="medium" selected>Medium</option>
      <option value="hard">Hard</option>
    </select>
    <button id="theme-toggle" type="button">Dark Mode</button>
    <button id="new-game">New Game</button>
    <button id="hint">Use Hint</button>
    <button id="check-solution">Check Solution</button>
    <span id="message"></span>
  </div>
  <section class="scoreboard" aria-labelledby="scoreboard-title">
    <h2 id="scoreboard-title">Top 10 Scores</h2>
    <table>
      <thead>
        <tr>
          <th scope="col">Rank</th>
          <th scope="col">Name</th>
          <th scope="col">Time</th>
          <th scope="col">Difficulty</th>
          <th scope="col">Hints</th>
        </tr>
      </thead>
      <tbody id="scoreboard-body"></tbody>
    </table>
  </section>
  <script src="/static/main.js"></script>
</body>
</html>
